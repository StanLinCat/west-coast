<style>
  /* 這是 Light Mode 下的基礎樣式 */
  .custom-form {
    /* 修正背景：使用主題的容器背景色 (假設為 --background-card) */
    background: var(--background-card, #FFFFFF); 
    border: 1px solid var(--border-color, #CCCCCC); 
    width: 100%; 
    max-width: 100% !important;
    margin: 20px auto;
    padding: 20px;
    border-radius: 8px;
  }
  
  /* 標籤文字 (Light Mode Default) */
  .form-group label {
    display: block;
    margin-bottom: 5px;
    font-weight: bold;
    color: var(--text-color, #333333); 
  }

  /* 必填標記 */
  .required-star:after {
    content: " *";
    color: red;
  }
  
  /* 輸入框 (Light Mode Default) */
  .form-group input, .form-group textarea {
    width: 100%;
    padding: 10px;
    border-radius: 4px;
    box-sizing: border-box;
    background: var(--input-background-color, #FFFFFF);
    color: var(--text-color, #333333);
    border: 1px solid var(--border-color, #CCCCCC);
  }

  /* ================================================= */
  /* ⬇️ 暗色模式覆寫 (Dark Mode Overrides) ⬇️ */
  /* ================================================= */
  .dark .custom-form {
    background: var(--background-dark-card, #2b2b2b); 
    border: 1px solid var(--border-color-dark, #505050); 
  }

  .dark .form-group label {
    color: var(--color-white); 
  }
  
  .dark .form-group input, .dark .form-group textarea {
    color: var(--color-white); 
    background: var(--background-dark-input, #3b3b3b); 
    border: 1px solid var(--border-color-dark, #505050);
  }

  /* 按鈕樣式保持不變 */
  .submit-btn {
    background-color: #4CAF50;
    color: white;
    padding: 12px 20px;
    border: none;
    border-radius: 4px;
    cursor: pointer;
    width: 100%;
    font-size: 16px;
    margin-top: 10px; 
  }
  .submit-btn:hover {
    background-color: #45a049;
  }
  .submit-btn:disabled {
    background-color: #cccccc;
    cursor: not-allowed;
  }
</style>

<div class="custom-form">
  <form name="google-sheet-form">
    
    <div class="form-group">
      <label for="name" class="required-star">您的稱呼</label>
      <input type="text" id="name" name="name" placeholder="王小明" required>
    </div>

    <div class="form-group">
      <label for="email" class="required-star">電子郵件</label>
      <input type="email" id="email" name="email" placeholder="example@gmail.com" required>
    </div>

    <div class="form-group">
      <label for="transfer_date" class="required-star">匯款日期</label>
      <input type="date" id="transfer_date" name="transfer_date" required>
    </div>

    <div class="form-group">
      <label for="amount" class="required-star">匯款金額</label>
      <input type="number" id="amount" name="amount" min="1" step="1" placeholder="必須是正整數" required>
    </div>

    <div class="form-group">
      <label for="last_5_digits" class="required-star">匯款帳號後五碼</label>
      <input type="text" id="last_5_digits" name="last_5_digits" pattern="[0-9]{5}" maxlength="5" placeholder="請輸入五個數字" required>
    </div>

    <div class="form-group">
      <label for="phone" class="required-star">連絡電話</label>
      <input type="tel" id="phone" name="phone" placeholder="09xxxxxxxx" required>
    </div>

    <div class="form-group">
      <label for="receipt_title">收據抬頭(個人或公司全名)</label>
      <input type="text" id="receipt_title" name="receipt_title" placeholder="選填">
    </div>

    <div class="form-group">
      <label for="receipt_address">收據地址</label>
      <input type="text" id="receipt_address" name="receipt_address" placeholder="選填">
    </div>

    <div class="form-group">
      <label for="message">備註</label> 
      <textarea id="message" name="message" rows="3" placeholder="ex：奉獻原因" ></textarea>
    </div>

    <button type="submit" class="submit-btn" id="submitBtn">送出資料</button>
  </form>
</div>

<script>
  // ★★★ 請保持你的 Google Script 網址不變動 ★★★
  const scriptURL = 'https://script.google.com/macros/s/AKfycbxDu0jey7rZXATcoOuQaos3VIBh5Xx1J0xKJwd9rgNl-a-x8ThMluVTmgvvrBWwQfzOlw/exec'; // 這是您實際的網址
  const form = document.forms['google-sheet-form'];
  const btn = document.getElementById('submitBtn');
  const transferDateInput = document.getElementById('transfer_date');
  
  // 1. 設置匯款日期的預設值為今天 (YYYY-MM-DD 格式)
  const today = new Date();
  const year = today.getFullYear();
  // 月份和日期必須是兩位數
  const month = String(today.getMonth() + 1).padStart(2, '0');
  const day = String(today.getDate()).padStart(2, '0');
  transferDateInput.value = `${year}-${month}-${day}`;

  
  form.addEventListener('submit', e => {
    e.preventDefault(); 
    
    // 前端自定義驗證：金額必須是正整數
    const amountValue = parseInt(document.getElementById('amount').value);
    if (isNaN(amountValue) || amountValue < 1 || !Number.isInteger(amountValue)) {
      alert("錯誤：匯款金額必須是正整數 (大於 0)。");
      document.getElementById('amount').focus();
      return;
    }

    // 前端自定義驗證：帳號後五碼必須是五個數字
    const last5Value = document.getElementById('last_5_digits').value;
    if (!/^\d{5}$/.test(last5Value)) {
      alert("錯誤：匯款帳號後五碼必須是五個數字。");
      document.getElementById('last_5_digits').focus();
      return;
    }

    // 禁用按鈕並顯示狀態
    btn.disabled = true;
    btn.innerText = "資料傳送中...";

    fetch(scriptURL, { method: 'POST', body: new FormData(form)})
      .then(response => {
        alert("您填寫的資料已送出！請確認email是否收到資料備份。");
        form.reset(); 
        // 重設日期為今天
        document.getElementById('transfer_date').value = `${year}-${month}-${day}`;
        btn.disabled = false;
        btn.innerText = "送出資料";
      })
      .catch(error => {
        console.error('Error!', error.message);
        alert("發生錯誤，請稍後再試。");
        btn.disabled = false;
        btn.innerText = "送出資料";
      });
  });
</script>
